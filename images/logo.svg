<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb76c"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#9d7838"/>
    </linearGradient>
  </defs>
  <!-- Crest Icon -->
  <g transform="translate(15, 10)">
    <!-- Shield Outline -->
    <path d="M30 5 L52 13 C52 35, 30 52, 30 55 C30 52, 8 35, 8 13 Z" 
          fill="#11291f" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Laurel Sprigs -->
    <path d="M12 25 C14 20, 20 18, 22 22 M10 33 C14 28, 22 28, 24 33 M12 41 C16 38, 22 40, 24 44" 
          stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.8"/>
    <path d="M48 25 C46 20, 40 18, 38 22 M50 33 C46 28, 38 28, 36 33 M48 41 C44 38, 38 40, 36 44" 
          stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.8"/>
    <!-- Monogram Letters -->
    <text x="30" y="36" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="700" 
          fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">RL</text>
    <circle cx="30" cy="18" r="1.5" fill="url(#goldGrad)"/>
    <circle cx="30" cy="44" r="1.5" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Text Brand -->
  <g transform="translate(85, 20)">
    <text x="0" y="24" font-family="'Cinzel', 'Playfair Display', serif" font-size="20" font-weight="700" 
          fill="#11291f" letter-spacing="3">HERITAGE &amp; POLO</text>
    <text x="0" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" 
          fill="#c5a059" letter-spacing="4">OLD MONEY ATELIER &amp; ALBUMS</text>
  </g>
</svg>
